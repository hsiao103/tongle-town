<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>主題閱讀鎮（Sunnyside 風）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#16231a;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.pill{background:#fff3d6;color:#4a2c1a;border:3px solid #8a5a3a;box-shadow:0 3px 0 #4a2c1a;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;line-height:1.35}
#where{font-size:12px;font-weight:500;opacity:.92}
#mapBtn{pointer-events:auto;cursor:pointer;font-size:22px;padding:4px 10px}
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(168px + env(safe-area-inset-bottom));background:rgba(255,248,225,.96);color:#5a2d0c;border:3px solid #7a4b1e;border-radius:999px;padding:7px 16px;font-weight:900;font-size:14px;z-index:6;white-space:nowrap;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateX(-50%) translateY(-4px)}}
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);z-index:6;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid #fff;pointer-events:none}
#btnA{position:fixed;right:calc(26px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;background:#e8473b;border:4px solid #fff;font-size:32px;font-weight:900;color:#fff;z-index:6;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #8f241c;touch-action:none}
#btnA:active{transform:translateY(4px);box-shadow:0 1px 0 #8f241c}
@media (hover:hover) and (pointer:fine){#joy,#btnA{display:none}#prompt{bottom:40px}}
.inDlg #joy,.inDlg #btnA,.inDlg #prompt{display:none}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(580px,calc(100% - 20px));background:#fff8e1;color:#3a2a14;border:4px solid #7a4b1e;border-radius:8px;padding:14px 16px 12px;z-index:20;box-shadow:0 5px 0 #4a2c1a}
#dTitle{font-weight:900;font-size:17px;color:#b3401b;margin-bottom:6px}
#dText{font-size:15px;line-height:1.65;white-space:pre-line;margin-bottom:10px}
#dOpts{display:flex;flex-direction:column;gap:8px}
#dOpts button{font:inherit;font-size:15px;font-weight:700;padding:10px 12px;border-radius:12px;border:3px solid #7a4b1e;background:#ffd35c;color:#3a2a14;cursor:pointer;text-align:left;touch-action:manipulation}
#dOpts button:active{background:#ffbf1f}
.hidden{display:none!important}
#mini{position:fixed;inset:0;background:rgba(10,16,12,.94);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
#miniC{image-rendering:pixelated;border:3px solid #f5d76e;border-radius:6px;max-width:100%}
#legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:720px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px;font-size:12px}
.chip.ok{background:#2f8f4a;border-color:#9be5ae}
#miniCap{font-size:12px;opacity:.75}
#title{position:fixed;inset:0;z-index:40;background:linear-gradient(#7fd0f2,#5fc14c 70%,#3f9a45);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
#title h1{font-size:44px;margin:0;text-shadow:0 4px 0 #134018;letter-spacing:6px}
#title h2{margin:0;font-size:18px;font-weight:700;color:#fff3b0}
#title ul{margin:6px 0;padding:0;list-style:none;font-size:15px;line-height:1.9;background:rgba(0,0,0,.22);border-radius:14px;padding:10px 18px;text-align:left}
#startBtn{font:inherit;font-size:20px;font-weight:900;padding:12px 34px;border-radius:999px;border:4px solid #fff;background:#e8473b;color:#fff;cursor:pointer;box-shadow:0 5px 0 #8f241c;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
#who{display:flex;gap:8px;width:min(360px,100%)}
#who input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:3px solid #7a4b1e;background:#fff8e1;color:#3a2a14;text-align:center}
#dText.big{font-size:16px}
.chip.bk{background:#2f6fb0;border-color:#a9d3ff}
/* ===== 作者圖示、FB、E-mail（草地綠＋陽光黃）===== */
#title{overflow-y:auto;justify-content:safe center}
.wtc{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-top:6px;padding-top:12px;border-top:3px dotted rgba(255,255,255,.5);width:min(420px,100%)}
.wtc .lg,.wtc .ic{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;text-decoration:none;box-shadow:0 3px 0 #134018;transition:transform .12s}
.wtc .lg{background:#fff;border:3px solid #fff3b0}
.wtc .lg img{width:100%;height:100%;object-fit:cover;display:block}
.wtc .fb{background:#fff;border:3px solid #fff}.wtc .fb svg{width:100%;height:100%;fill:#2f7d32;display:block}
.wtc .ml{background:#ffd54f;border:3px solid #fff3b0;color:#134018}.wtc .ml svg{width:52%;height:52%;display:block}
.wtc .ic:hover,.wtc .ic:focus-visible{transform:translateY(-3px);outline:none}
.wtc .ic:focus-visible{box-shadow:0 3px 0 #134018,0 0 0 3px #fff}
.wtc .mailpop{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:13px;line-height:1.4;color:#fff}
.wtc .mailpop[hidden]{display:none}
.wtc .mailpop .ma{font-weight:800;word-break:break-all;-webkit-user-select:text;user-select:text;text-shadow:0 2px 0 #134018}
.wtc .mailpop button,.wtc .mailpop a{font:inherit;font-size:13px;font-weight:800;padding:7px 14px;border-radius:999px;border:3px solid #fff;background:#3f9a45;color:#fff;text-decoration:none;cursor:pointer;line-height:1.2;box-shadow:0 3px 0 #134018}
.wtc .mailpop .mgm{background:#e8473b;box-shadow:0 3px 0 #8f241c}
.wtc .mailpop .mapp{border-color:transparent;background:none;box-shadow:none;text-decoration:underline;color:#fff3b0}
</style>
</head>

<canvas id="game"></canvas>

<div class="hud">
  <div class="pill"><div id="score">⭐ 0/10</div><div id="where">找找看地圖上的數字地標！</div></div>

<div id="mini" class="hidden">

  <canvas id="miniC"></canvas>
  <div id="legend"></div>
  <div id="miniCap">點一下任意處關閉</div>
</div>
<div id="title">
  <h1>主題閱讀鎮</h1>
  <h2>校園為主 · 社區街道為輔 · 閱讀主題館開幕</h2>
  <ul>
    <li>🕹️ 搖桿／方向鍵／WASD：移動</li>

  </ul>
  <div id="who"><input id="pClass" placeholder="班級（例：601）" maxlength="8"><input id="pName" placeholder="姓名" maxlength="10"></div>

const THEMES=[{"id":"xiyou","name":"西遊記","icon":"🐵","color":"#e8a33d","tag":"取經路上的九九八十一難","lines":["聽說花果山的美猴王，會七十二變呢！","取經路上要經過九九八十一難，真不簡單。","孫悟空、豬八戒、沙悟淨，你覺得誰最可靠？"],"q":[{"d":"b","t":"唐僧的大徒弟是誰？","ans":"孫悟空","wr":["豬八戒","沙悟淨","白龍馬"],"e":"孫悟空是唐僧的大徒弟，有七十二變和筋斗雲。"},{"d":"b","t":"孫悟空使用的兵器是什麼？","ans":"如意金箍棒","wr":["九齒釘耙","降妖寶杖","青龍偃月刀"],"e":"如意金箍棒可以隨意變大變小，原本是東海龍宮的定海神針。"},{"d":"b","t":"豬八戒原本是天上的什麼官？","ans":"天蓬元帥","wr":["二郎神","太白金星","托塔天王"],"e":"豬八戒前世是天蓬元帥，因為犯錯被貶下凡間。"},{"d":"b","t":"唐僧師徒要去哪裡取經？","ans":"西天雷音寺","wr":["東海龍宮","花果山","南天門"],"e":"他們要到西天雷音寺，向如來佛祖求取真經。"},{"d":"b","t":"孫悟空是從哪裡出生的？","ans":"花果山","wr":["五行山","火焰山","高老莊"],"e":"孫悟空是從花果山的一塊仙石中蹦出來的。"},{"d":"b","t":"取經路上，負責挑行李的是誰？","ans":"沙悟淨","wr":["孫悟空","豬八戒","唐僧"],"e":"沙悟淨又叫沙和尚，一路挑著行李，默默幫忙。"},{"d":"b","t":"唐僧騎的白馬，原本是誰變的？","ans":"西海龍王的三太子","wr":["東海龍王本人","玉皇大帝的坐騎","太上老君的青牛"],"e":"白龍馬原本是西海龍王的三太子，因犯錯被罰變成白馬。"},{"d":"b","t":"孫悟空翻一個筋斗雲，大約可以飛多遠？","ans":"十萬八千里","wr":["一百里","一千里","一萬里"],"e":"筋斗雲一翻就是十萬八千里。"},{"d":"a","t":"孫悟空大鬧天宮後，被如來佛祖壓在哪座山下？","ans":"五行山","wr":["花果山","火焰山","靈山"],"e":"如來佛祖用手掌變成五行山，把孫悟空壓了五百年。"},{"d":"a","t":"孫悟空向誰借了芭蕉扇，才能扇滅火焰山的火？","ans":"鐵扇公主","wr":["白骨精","蜘蛛精","女兒國國王"],"e":"鐵扇公主（羅剎女）的芭蕉扇，能把火焰山的火扇熄。"},{"d":"a","t":"「三打白骨精」中，唐僧為什麼責怪孫悟空？","ans":"他看不出是妖怪變的，以為悟空亂殺好人","wr":["悟空偷吃了人參果","悟空搶走了他的經書","悟空打死了他的親戚"],"e":"唐僧肉眼凡胎，看不穿白骨精的變化，才會誤會悟空。"},{"d":"a","t":"人參果的故事，發生在哪一座道觀？","ans":"五莊觀","wr":["兜率宮","靈霄殿","水簾洞"],"e":"五莊觀的鎮元大仙，種有人參果樹。"},{"d":"a","t":"孫悟空在天庭第一個官職，是負責看管天馬的什麼官？","ans":"弼馬溫","wr":["齊天大聖","護法","鬥戰勝佛"],"e":"「弼馬溫」是個管馬的小官，悟空知道後大怒，反下天宮。"},{"d":"a","t":"唐僧的前世，是如來佛祖的哪位弟子？","ans":"金蟬子","wr":["阿難","迦葉","菩提"],"e":"唐僧前世是如來的弟子金蟬子，因為不專心聽經被貶下凡。"},{"d":"a","t":"取經成功後，孫悟空被封為什麼？","ans":"鬥戰勝佛","wr":["淨壇使者","金身羅漢","八部天龍"],"e":"悟空被封為鬥戰勝佛，豬八戒是淨壇使者，沙悟淨是金身羅漢。"},{"d":"h","t":"孫悟空向哪位祖師學會七十二變與筋斗雲？","ans":"須菩提祖師","wr":["太上老君","鎮元大仙","元始天尊"],"e":"須菩提祖師住在靈台方寸山、斜月三星洞，傳授悟空本領。"},{"d":"h","t":"《西遊記》一般認為是哪個朝代的吳承恩所作？","ans":"明朝","wr":["唐朝","宋朝","清朝"],"e":"《西遊記》是明代的長篇神魔小說，作者一般認為是吳承恩。"},{"d":"h","t":"唐僧的歷史原型是哪位高僧？","ans":"玄奘","wr":["鑑真","法顯","義淨"],"e function drawSet(th){

  for(const k of ['b','a','h']){const a=shuffle(by[k].slice()),n=Math.min(CONFIG.MIX[k]||0,a.length);out.push(...a.slice(0,n));rest.push(...a.slice(n))}

function startRun(th){
  const qs=drawSet(th);
  run={th,qs,i:0,score:0,max:maxOf(qs),hit:{b:[0,0],a:[0,0],h:[0,0]},t0:Date.now(),log:[]};

function nextQ(){
  const th=run.th;
  if(run.i>=run.qs.length)return endRun();
  const q=run.qs[run.i];
  const opts=shuffle([q.ans].concat(q.wr.filter(Boolean)).map((t,k)=>({t,ok:k===0})));

function answer(q,o,opts){
  const pts=CONFIG.POINTS[q.d];
  run.hit[q.d][1]++;
  if(o.ok){run.score+=pts;run.hit[q.d][0]++;jingle()}else beep(180,.25,'sawtooth');
  run.log.push(q.t.slice(0,12)+(o.ok?'○':'×'));
  run.i++;
  const last=run.i>=run.qs.length;
  showDlg(o.ok?'✅ 答對了！+'+pts+' 分':'❌ 再接再厲','正確答案：'+q.ans+'\n'+q.e+'\n\n目前 '+run.score+' / '+run.max+' 分',[{t:last?'看成績':'下一題',f:nextQ}]);

function rankOf(p){return p>=.9?'🏆 閱讀大師':p>=.7?'🥇 閱讀達人':p>=.5?'🥈 閱讀新星':'🌱 繼續加油'}
function endRun(){
  const {th,score,max,hit}=run,pct=Math.round(score/max*100);
  const r=rec[th.id]||(rec[th.id]={best:0,max,plays:0});
  const isBest=score>=r.best;
  r.plays++;if(score>=r.best){r.best=score;r.max=max}
  saveRec();updateHUD();buildLegend();
  const who=whoAmI();
  const payload={time:new Date().toISOString(),cls:who.cls||'',name:who.name||'匿名',theme:th.name,score,max,pct,
    basic:hit.b[0]+'/'+hit.b[1],advanced:hit.a[0]+'/'+hit.a[1],high:hit.h[0]+'/'+hit.h[1],
    seconds:Math.round((Date.now()-run.t0)/1000),rank:rankOf(score/max).replace(/^\S+\s/,'')};
  const sent=submitScore(payload);
  jingle();
  const th2=th;
  showDlg('📊 '+th.name+' 成績單',rankOf(score/max)+'\n得分：'+score+' / '+max+' 分（'+pct+'%）'+(isBest&&r.plays>1?'　🎉 刷新最佳！':'')+
    '\n基本 '+payload.basic+'　進階 '+payload.advanced+'　高階 '+payload.high+
    '\n\n'+(sent==='sheet'?'☁️ 成績已送出至試算表':sent==='none'?'💾 成績已存在這台裝置（尚未連結試算表）':''),

/* --- 從試算表（CSV）載入題庫：主題,難度,題目,正確答案,錯誤答案1,錯誤答案2,錯誤答案3,解析 --- */
function parseCSV(s){
  const rows=[];let row=[],cur='',q=false;
  s=s.replace(/^\uFEFF/,'');
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function applyBankCSV(text){
  const rows=parseCSV(text),map={基本:'b',進階:'a',高階:'h',b:'b',a:'a',h:'h'},got={};
  for(const r of rows){
    const th=THEMES.find(t=>t.name===(r[0]||'').trim()),d=map[(r[1]||'').trim()];
    if(!th||!d||!(r[2]||'').trim()||!(r[3]||'').trim())continue;
    const wr=[r[4],r[5],r[6]].map(x=>(x||'').trim()).filter(Boolean);
    if(!wr.length)continue;
    (got[th.id]=got[th.id]||[]).push({d,t:r[2].trim(),ans:r[3].trim(),wr:wr.slice(0,3),e:(r[7]||'').trim()||'答案是「'+r[3].trim()+'」。'});
  }
  let n=0;
  for(const th of THEMES)if(got[th.id]&&got[th.id].length>=CONFIG.PER_RUN){th.q=got[th.id];n++}
  return n;
}
function loadBank(){
  const url=CONFIG.BANK_URL||(CONFIG.SHEET_URL?CONFIG.SHEET_URL+(CONFIG.SHEET_URL.includes('?')?'&':'?')+'action=bank':'');
  if(!url||typeof fetch!=='function')return;
  fetch(url).then(r=>r.text()).then(t=>{const n=applyBankCSV(t);if(n)console.log('已從試算表載入 '+n+' 個主題題庫')}).catch(()=>{});
}

function nearest(){

  return best;
}

const joyEl=$('joy'),knob=$('knob'),joy={x:0,y:0};let joyId=null;
function joyMove(e){
  const r=joyEl.getBoundingClientRect(),R=r.width/2-8;
  let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);
  if(d>R){dx*=R/d;dy*=R/d}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  if(d<10){joy.x=0;joy.y=0}else{joy.x=dx/R;joy.y=dy/R}
}
function joyEnd(){joyId=null;joy.x=0;joy.y=0;knob.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;try{joyEl.setPointerCapture(e.pointerId)}catch(_){}joyMove(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});

function inputVec(){
  let x=0,y=0;
  if(keys['arrowleft']||keys['a'])x-=1;if(keys['arrowright']||keys['d'])x+=1;
  if(keys['arrowup']||keys['w'])y-=1;if(keys['arrowdown']||keys['s'])y+=1;
  x+=joy.x;y+=joy.y;
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
  return m<.12?[0,0]:[x,y];
}

let last=0,time=0,lastPrompt='';
function update(dt){
  time+=dt;
  if(!(started&&!dlg&&!miniOpen)){P.moving=false;P.anim=0}
  else{
    const v=inputVec(),sp=66;
    if(v[0]||v[1]){
      P.moving=true;P.anim+=dt;
      if(Math.abs(v[0])>Math.abs(v[1]))P.dir=v[0]<0?2:3;else P.dir=v[1]<0?1:0;
      const nx=P.x+v[0]*sp*dt;if(!blocked(nx,P.y))P.x=nx;
      const ny=P.y+v[1]*sp*dt;if(!blocked(P.x,ny))P.y=ny;
    }else{P.moving=false;P.anim=0}
  }
  for(const n of NPCS){
    if(dlg){continue}
    n.t-=dt;
    if(n.t<=0){
      n.t=.8+Math.random()*1.8;
      const r=Math.random();
      if(r<.3){n.vx=0;n.vy=0}
      else{n.dir=(Math.random()*4)|0;const spd=n.animal?12:26;n.vx=[0,0,-1,1][n.dir]*spd;n.vy=[1,-1,0,0][n.dir]*spd}
    }
    if(n.vx||n.vy){
      n.anim+=dt;
      const nx=n.x+n.vx*dt,ny=n.y+n.vy*dt;
      const okp=(qx,qy)=>!blocked(qx,qy)&&(!n.box||(qx>=n.box[0]&&qx<=n.box[2]&&qy>=n.box[1]&&qy<=n.box[3]));
      if(okp(nx,n.y))n.x=nx;else n.t=0;
      if(okp(n.x,ny))n.y=ny;else n.t=0;
    }else n.anim=0;
  }
  const nb=nearest();
  let txt='';
  if(nb&&started&&!dlg&&!miniOpen)txt=nb.lm?'按 A／空白鍵：'+nb.lm.name:(nb.npc&&nb.npc.animal?'按 A／空白鍵：摸摸小動物':'按 A／空白鍵：和居民聊聊');
  if(txt!==lastPrompt){
    lastPrompt=txt;const pr=$('prompt');
    if(txt){pr.textContent=txt;pr.classList.remove('hidden')}else pr.classList.add('hidden');
    $('where').textContent=nb&&nb.lm?'📍 '+(nb.lm.book?'📚':nb.lm.n)+'・'+nb.lm.name:'找找看地圖上的數字地標！';
  }
  for(const c of confetti){c.x+=c.vx*dt;c.y+=c.vy*dt}
  while(confetti.length&&confetti[0].y>1.2)confetti.shift();
}
let waterPat=null;
function render(){
  const vw=cvs.width,vh=cvs.height,MW=W*T,MH=H*T;
  let cx=MW<=vw?(MW-vw)/2:clamp(P.x-vw/2,0,MW-vw);
  let cy=MH<=vh?(MH-vh)/2:clamp(P.y-10-vh/2,0,MH-vh);
  cx=Math.round(cx);cy=Math.round(cy);
  if(!waterPat){const wc=document.createElement('canvas');wc.width=wc.height=64;wc.getContext('2d').drawImage(AT,AR.water.x,AR.water.y,64,64,0,0,64,64);waterPat=ctx.createPattern(wc,'repeat')}
  ctx.fillStyle='#16a4d8';ctx.fillRect(0,0,vw,vh);
  ctx.save();ctx.translate(-cx,-cy);
  ctx.fillStyle=waterPat||'#16a4d8';ctx.fillRect(cx,cy,vw,vh);
  ctx.drawImage(ground,0,0);
  // 水面閃爍
  const f=Math.floor(time*2);
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(const w of waterTiles){
    const px=w[0]*T,py=w[1]*T;
    if(px<cx-T||px>cx+vw||py<cy-T||py>cy+vh)continue;
    if((w[0]*7+w[1]*13+f)%5===0)ctx.fillRect(px+3+((w[0]+f)%4)*2,py+5,5,1);
    if((w[0]*3+w[1]*5+f)%7===0)ctx.fillRect(px+8,py+11,4,1);
  }
  const list=[];
  for(const n of NPCS){if(n.x<cx-40||n.x>cx+vw+40||n.y<cy-20||n.y>cy+vh+60)continue;list.push({y:n.y,d:n.animal?()=>drawAnimal(ctx,n,time):()=>drawHuman(ctx,n.x,n.y,n.hv,n.sv,n.anim?Math.floor(n.anim*10)%8:0,false,time)})}
  for(const tr of trees){const bx=tr.x*T,by=tr.y*T+T;if(bx<cx-40||bx>cx+vw+40||by<cy-8||by>cy+vh+60)continue;list.push({y:by,d:()=>drawTreeDyn(ctx,tr,time)})}
  for(const hs of houses){const bx=hs.x*T,by=(hs.y+5)*T;if(bx<cx-60||bx>cx+vw+20||by<cy-8||by>cy+vh+90)continue;list.push({y:by,d:()=>sp(ctx,'house'+hs.c,bx,hs.y*T)})}
  list.push({y:P.y,d:()=>drawHuman(ctx,P.x,P.y,5,3,P.moving?Math.floor(P.anim*10)%8:0,true,time)});
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
  for(const L of LM)drawMarker(ctx,L,time,!L.book&&done.has(L.n));
  ctx.restore();
  for(const c of confetti){ctx.fillStyle=c.c;ctx.fillRect(Math.round(c.x*vw),Math.round(c.y*vh),c.r,c.r)}
}
function frame(ts){

}
